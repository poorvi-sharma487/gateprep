
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GATEPrep | Pointer Practice</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fc;
      color: #202b46;
    }

    header {
      background: white;
      padding: 18px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 12px #0000000a;
    }

    .logo {
      color: #5145cd;
      font-size: 23px;
      font-weight: bold;
    }

    header a {
      color: #5145cd;
      text-decoration: none;
      font-weight: bold;
    }

    .container {
      max-width: 800px;
      margin: 35px auto;
      padding: 0 18px;
    }

    .top {
      background: linear-gradient(120deg, #5145cd, #8379f4);
      color: white;
      padding: 25px;
      border-radius: 16px;
      margin-bottom: 22px;
    }

    .top h1 {
      margin-bottom: 9px;
      font-size: 27px;
    }

    .top p {
      line-height: 1.6;
    }

    .progress-bg {
      background: #dedafc;
      height: 8px;
      border-radius: 10px;
      margin-top: 18px;
      overflow: hidden;
    }

    #progressBar {
      width: 0%;
      height: 100%;
      background: #ffffff;
      transition: width 0.3s;
    }

    .quiz {
      background: white;
      border: 1px solid #e4e8f2;
      border-radius: 16px;
      padding: 27px;
    }

    .meta {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: #6c7690;
      font-size: 14px;
      margin-bottom: 20px;
    }

    #question {
      font-size: 20px;
      line-height: 1.6;
      margin-bottom: 22px;
    }

    .option {
      display: block;
      padding: 15px;
      border: 1px solid #dfe3ef;
      border-radius: 10px;
      margin-bottom: 12px;
      cursor: pointer;
      line-height: 1.5;
    }

    .option:hover {
      background: #f4f2ff;
      border-color: #5145cd;
    }

    .option.selected {
      background: #eeedff;
      border-color: #5145cd;
    }

    .option.correct {
      background: #e7f8ed;
      border-color: #239451;
    }

    .option.wrong {
      background: #fff0f0;
      border-color: #d64242;
    }

    .option input {
      margin-right: 9px;
      accent-color: #5145cd;
    }

    button {
      border: none;
      border-radius: 9px;
      padding: 12px 18px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .primary {
      background: #5145cd;
      color: white;
    }

    .secondary {
      background: #eeedff;
      color: #5145cd;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }

    #feedback {
      display: none;
      margin-top: 20px;
      padding: 16px;
      border-radius: 10px;
      line-height: 1.6;
    }

    #feedback.good {
      display: block;
      background: #e7f8ed;
      color: #176b37;
    }

    #feedback.bad {
      display: block;
      background: #fff0f0;
      color: #a82c2c;
    }

    #result {
      display: none;
      text-align: center;
      padding: 25px 0;
    }

    #result h2 {
      margin-bottom: 12px;
      font-size: 27px;
    }

    #result p {
      margin-bottom: 20px;
      line-height: 1.6;
    }

    @media(max-width: 500px) {
      .quiz { padding: 18px; }
      .top h1 { font-size: 23px; }
      #question { font-size: 18px; }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">🎓 GATEPrep</div>
    <a href="/subjects/">← All Subjects</a>
  </header>

  <main class="container">
    <section class="top">
      <h1>💻 C Programming: Pointers</h1>
      <p>Test your understanding with these practice questions.</p>
      <div class="progress-bg">
        <div id="progressBar"></div>
      </div>
    </section>

    <section class="quiz" id="quiz">
      <div class="meta">
        <span id="questionNumber">Question 1 of 5</span>
        <span id="scoreLabel">Score: 0</span>
      </div>

      <h2 id="question">Question will appear here</h2>

      <div id="options"></div>

      <div id="feedback" aria-live="polite"></div>

      <div class="actions">
        <button class="primary" id="checkBtn" onclick="checkAnswer()">
          Check Answer
        </button>

        <button class="primary" id="nextBtn" onclick="nextQuestion()" hidden>
          Next Question →
        </button>
      </div>
    </section>

    <section class="quiz" id="result">
      <h2>🎉 Practice Completed!</h2>
      <p id="resultText"></p>
      <button class="primary" onclick="restartQuiz()">Try Again</button>
      <a class="btn-link" href="/subjects/"></a>
    </section>
  </main>



<script>
  let questions = [];
  let current = 0;
  let score = 0;
  let answered = false;
  let selected = -1;

  const params = new URLSearchParams(window.location.search);
  const subject = params.get("subject") || "";
  const topic = params.get("topic") || "";

  const questionElement = document.getElementById("question");
  const optionsElement = document.getElementById("options");
  const feedbackElement = document.getElementById("feedback");
  const checkBtn = document.getElementById("checkBtn");
  const nextBtn = document.getElementById("nextBtn");

  function readableName(slug) {
    return slug.split("-")
      .map(word => word.charAt(0).toUpperCase() + word.slice(1))
      .join(" ");
  }

  async function startQuiz() {
    if (!subject || !topic) {
      showError("Subject ya topic nahi mila. Subjects page par jaakar Practice Questions par click karo.");
      return;
    }

    document.getElementById("questionNumber").textContent = "Questions load ho rahe hain...";

    try {
      const response = await fetch(
        `/api/questions?subject=${encodeURIComponent(subject)}&topic=${encodeURIComponent(topic)}`
      );

      if (!response.ok) {
        throw new Error("Questions load nahi hue.");
      }

      const data = await response.json();

      questions = data.map(q => ({
        question: q.question_text,
        options: q.options,
        answer: Number(q.correct_option),
        explanation: q.explanation
      }));

      document.querySelector(".top h1").textContent =
        "🎯 " + readableName(subject) + ": " + readableName(topic);

      if (questions.length === 0) {
        showError("Is topic ke questions database mein nahi mile.");
        return;
      }

      loadQuestion();
    } catch (error) {
      console.error(error);
      showError("Questions load nahi hue. Server check karo.");
    }
  }

  function showError(message) {
    document.getElementById("questionNumber").textContent = "Notice";
    questionElement.textContent = message;
    optionsElement.innerHTML = "";
    checkBtn.hidden = true;
    nextBtn.hidden = true;
  }

  function loadQuestion() {
    answered = false;
    selected = -1;

    const q = questions[current];

    document.getElementById("questionNumber").textContent =
      `Question ${current + 1} of ${questions.length}`;

    document.getElementById("scoreLabel").textContent = `Score: ${score}`;

    document.getElementById("progressBar").style.width =
      `${(current / questions.length) * 100}%`;

    questionElement.textContent = q.question;
    optionsElement.innerHTML = "";
    feedbackElement.className = "";
    feedbackElement.textContent = "";
    feedbackElement.style.display = "none";

    q.options.forEach(function(option, index) {
      const label = document.createElement("label");
      label.className = "option";

      const radio = document.createElement("input");
      radio.type = "radio";
      radio.name = "answer";
      radio.value = index;

      radio.addEventListener("change", function() {
        if (answered) return;
        selected = index;

        document.querySelectorAll(".option").forEach(function(item) {
          item.classList.remove("selected");
        });

        label.classList.add("selected");
      });

      label.appendChild(radio);
      label.appendChild(document.createTextNode(
        String.fromCharCode(65 + index) + ". " + option
      ));

      optionsElement.appendChild(label);
    });

    checkBtn.hidden = false;
    checkBtn.disabled = false;
    nextBtn.hidden = true;
    nextBtn.textContent = "Next Question →";
  }

  function checkAnswer() {
    if (answered) return;

    if (selected === -1) {
      alert("Please select an answer first.");
      return;
    }

    answered = true;
    const q = questions[current];
    const labels = document.querySelectorAll(".option");

    labels.forEach(function(label, index) {
      label.querySelector("input").disabled = true;

      if (index === q.answer) {
        label.classList.add("correct");
      } else if (index === selected) {
        label.classList.add("wrong");
      }
    });

    if (selected === q.answer) {
      score++;
      feedbackElement.className = "good";
      feedbackElement.textContent = "Correct answer! " + q.explanation;
    } else {
      feedbackElement.className = "bad";
      feedbackElement.textContent =
        "Incorrect. Correct answer: " +
        String.fromCharCode(65 + q.answer) + ". " +
        q.options[q.answer] + ". " + q.explanation;
    }

    feedbackElement.style.display = "block";
    document.getElementById("scoreLabel").textContent = `Score: ${score}`;

    checkBtn.hidden = true;
    nextBtn.hidden = false;

    if (current === questions.length - 1) {
      nextBtn.textContent = "View Result";
    }
  }

  function nextQuestion() {
    if (!answered) return;

    if (current < questions.length - 1) {
      current++;
      loadQuestion();
    } else {
      showResult();
    }
  }

 
async function showResult() {
  document.getElementById("quiz").style.display = "none";
  document.getElementById("result").style.display = "block";
  document.getElementById("progressBar").style.width = "100%";

  const accuracy = Math.round((score / questions.length) * 100);

  document.getElementById("resultText").textContent =
    `You scored ${score} out of ${questions.length}. ` +
    `Accuracy: ${accuracy}%. Saving your result...`;

  try {
    const response = await fetch("/api/quiz-results", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        subject: subject,
        topic: topic,
        score: score,
        totalQuestions: questions.length
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.message || "Score save nahi hua");
    }

    document.getElementById("resultText").textContent =
      `You scored ${score} out of ${questions.length}. ` +
      `Accuracy: ${accuracy}%. Your score has been saved!`;

  } catch (error) {
    console.error("Score save error:", error);

    document.getElementById("resultText").textContent =
      `You scored ${score} out of ${questions.length}. ` +
      `Accuracy: ${accuracy}%. Score save nahi hua. ` +
      `Please login karke dobara try karo.`;
  }
}

  function restartQuiz() {
    current = 0;
    score = 0;
    answered = false;
    selected = -1;

    document.getElementById("quiz").style.display = "block";
    document.getElementById("result").style.display = "none";

    loadQuestion();
  }

  startQuiz();
</script>
</body>
</html>
