<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GATEPrep | Progress</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }

    .container {
      width: 90%;
      max-width: 1100px;
      margin: 40px auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .header h1 {
      font-size: 30px;
    }

    .back-btn {
      text-decoration: none;
      background: #4f46e5;
      color: white;
      padding: 10px 18px;
      border-radius: 8px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 30px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .card h3 {
      color: #6b7280;
      font-size: 15px;
      margin-bottom: 10px;
    }

    .card p {
      font-size: 28px;
      font-weight: bold;
    }

    .history {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .history h2 {
      margin-bottom: 20px;
    }

    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 14px;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
    }

    th {
      background: #eef2ff;
    }

    .message {
      color: #6b7280;
      margin-bottom: 15px;
    }

    @media (max-width: 700px) {
      .stats {
        grid-template-columns: 1fr;
      }

      .header {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <h1>📊 My Progress</h1>

      <a href="/dashboard.html" class="back-btn">
        ← Dashboard
      </a>
    </div>

    <!-- Statistics -->
    <div class="stats">

      <div class="card">
        <h3>Total Quizzes</h3>
        <p id="totalQuizzes">0</p>
      </div>

      <div class="card">
        <h3>Questions Attempted</h3>
        <p id="totalQuestions">0</p>
      </div>

      <div class="card">
        <h3>Average Accuracy</h3>
        <p id="averageAccuracy">0%</p>
      </div>

    </div>

    <!-- Quiz History -->
    <div class="history">

      <h2>Quiz History</h2>

      <p id="message" class="message">
        Loading your progress...
      </p>

      <div class="table-container">

        <table>

          <thead>
            <tr>
              <th>Subject</th>
              <th>Topic</th>
              <th>Score</th>
              <th>Accuracy</th>
              <th>Date</th>
            </tr>
          </thead>

          <tbody id="historyTable">
          </tbody>

        </table>

      </div>

    </div>

  </div>


  <script>

    async function loadProgress() {

      const message = document.getElementById("message");
      const table = document.getElementById("historyTable");

      try {

        const response = await fetch("/api/quiz-results");

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || "Progress load nahi hui");
        }

        // No quiz attempted
        if (data.length === 0) {

          message.textContent =
            "Abhi tak koi quiz attempt nahi kiya hai.";

          return;
        }

        // Total quizzes
        document.getElementById("totalQuizzes").textContent =
          data.length;


        // Total questions
        let totalQuestions = 0;

        data.forEach(item => {
          totalQuestions += Number(item.total_questions);
        });

        document.getElementById("totalQuestions").textContent =
          totalQuestions;


        // Average accuracy
        let totalAccuracy = 0;

        data.forEach(item => {
          totalAccuracy += Number(item.accuracy);
        });

        const averageAccuracy =
          totalAccuracy / data.length;

        document.getElementById("averageAccuracy").textContent =
          averageAccuracy.toFixed(2) + "%";


        // Message
        message.textContent =
          `You have attempted ${data.length} quiz${data.length > 1 ? "zes" : ""}.`;


        // Clear table
        table.innerHTML = "";


        // Add rows
        data.forEach(item => {

          const row = document.createElement("tr");


          const subject = document.createElement("td");

          subject.textContent =
            item.subject_slug.replace(/-/g, " ");


          const topic = document.createElement("td");

          topic.textContent =
            item.topic_slug.replace(/-/g, " ");


          const score = document.createElement("td");

          score.textContent =
            `${item.score} / ${item.total_questions}`;


          const accuracy = document.createElement("td");

          accuracy.textContent =
            Number(item.accuracy).toFixed(2) + "%";


          const date = document.createElement("td");

          date.textContent =
            new Date(item.attempted_at).toLocaleString();


          row.append(
            subject,
            topic,
            score,
            accuracy,
            date
          );


          table.appendChild(row);

        });

      }

      catch (error) {

        console.error("Progress error:", error);

        message.textContent =
          "Progress load nahi hui. Pehle login karo aur server check karo.";

      }

    }


    loadProgress();

  </script>

</body>
</html>
