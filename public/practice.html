<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url=./#subjects">
  <title>GATEPrep | Practice</title>
  <link rel="stylesheet" href="./assets/css/app.css">
  <script>
    const params = new URLSearchParams(window.location.search);
    const subject = params.get("subject");
    const topic = params.get("topic");
    if (subject && topic) {
      window.location.replace("./#practice/" + encodeURIComponent(subject) + "/" + encodeURIComponent(topic));
    } else if (subject) {
      window.location.replace("./#subject/" + encodeURIComponent(subject));
    } else {
      window.location.replace("./#subjects");
    }
  </script>
</head>
<body>
  <div style="padding: 40px; text-align: center; font-family: -apple-system, BlinkMacSystemFont, sans-serif;">
    <h1 style="color: #059669; margin-bottom: 12px;">Practice Questions</h1>
    <p style="color: #64748b; margin-bottom: 20px;">Redirecting to practice portal...</p>
    <a href="./#subjects" class="button button-primary">Click here if not redirected</a>
  </div>
</body>
</html>
